<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>萬字開獎</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* 網頁顯示區域 */
        .content {
            flex: 1;
            width: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 底部導覽列 */
        .bottom-nav {
            height: 60px;
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666666;
            background: none;
            border: none;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s;
        }

        /* 點選啟動時的顏色 */
        .nav-item.active {
            color: #007bff;
            font-weight: bold;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- 網頁嵌入容器 -->
    <div class="content">
        <iframe id="webFrame" src="https://www.magnum4d.my/"></iframe>
    </div>

    <!-- 底部導覽列 -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab(this, 'https://www.magnum4d.my/')">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            Magnum
        </button>
        <button class="nav-item" onclick="switchTab(this, 'https://www.sportstoto.com.my/')">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            Toto
        </button>
        <button class="nav-item" onclick="switchTab(this, 'https://www.damacai.com.my/')">
            <svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H5V8h14v10z"/></svg>
            DaMaCai
        </button>
        <button class="nav-item" onclick="switchTab(this, 'https://www.singaporepools.com.sg/en/services/Pages/4d-results.aspx')">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            SG Pools
        </button>
    </nav>

    <script>
        function switchTab(button, url) {
            // 切換 iframe 顯示網址
            document.getElementById('webFrame').src = url;

            // 切換按鈕高亮狀態
            const items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            button.classList.add('active');
        }
    </script>
</body>
</html>
